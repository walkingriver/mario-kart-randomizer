<div class="app-shell">
  <header class="app-header">
    <h1 class="app-title">MK8R</h1>
    <nav class="app-nav" aria-label="Main">
      @for (item of navItems; track item.url) {
        <a
          class="nav-link"
          [routerLink]="item.url"
          routerLinkActive="active"
          >{{ item.title }}</a
        >
      }
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
