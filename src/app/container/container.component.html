<div class="mk-slot-machine" #container>
  <div class="mk-slot-frame">
    <div class="mk-slot-window" [class.is-spinning]="spinning()">
      <div class="mk-slot-shade mk-slot-shade--top" aria-hidden="true"></div>
      <div class="mk-slot-shade mk-slot-shade--bottom" aria-hidden="true"></div>
      <ul #reel class="mk-reel">
        @for (item of reelItems; track $index) {
          <li class="mk-reel-item">
            <img [src]="getImage(item)" [alt]="item.name" loading="eager" decoding="async" />
            <span class="mk-label">{{ item.name }}</span>
          </li>
        }
      </ul>
      <div class="mk-slot-glass" aria-hidden="true"></div>
      <div class="mk-slot-payline" aria-hidden="true"></div>
    </div>
  </div>
</div>
